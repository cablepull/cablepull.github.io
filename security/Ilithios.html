<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ILITHIOS / BYOVD Pipeline Analysis — Edge Cases</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070b12;--bg2:#0c1119;--bg3:#111821;
  --bdr:#1a2333;--bdr2:#243044;
  --g:#00e5a0;--g2:#00b87f;
  --o:#ff6b35;--b:#38b6ff;
  --p:#c084fc;--r:#ff4757;--y:#ffd32a;
  --t1:#e2e8f0;--t2:#8899b0;--t3:#3a4a60;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--t1);font-family:'Barlow',sans-serif;display:flex;font-size:14px;line-height:1.5}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--bdr2);border-radius:2px}

.sidebar{width:215px;min-width:215px;background:var(--bg2);border-right:1px solid var(--bdr);display:flex;flex-direction:column}
.sb-head{padding:18px 16px 14px;border-bottom:1px solid var(--bdr)}
.sb-logo{font-family:'Rajdhani',sans-serif;font-size:21px;font-weight:700;color:var(--g);letter-spacing:3px;text-transform:uppercase}
.sb-tag{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--t3);margin-top:3px}
.sb-cat{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--t3);letter-spacing:2px;text-transform:uppercase;padding:10px 16px 3px}
.nav-list{flex:1;overflow-y:auto;padding:4px 0 16px}
.nb{width:100%;background:none;border:none;border-left:2px solid transparent;padding:8px 14px;cursor:pointer;display:flex;align-items:flex-start;gap:9px;transition:all .12s;text-align:left;color:var(--t2)}
.nb:hover{background:var(--bg3);color:var(--t1);border-left-color:var(--bdr2)}
.nb.active{background:rgba(0,229,160,.05);color:var(--g);border-left-color:var(--g)}
.nb-n{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--t3);padding-top:1px;min-width:18px}
.nb.active .nb-n{color:var(--g2)}
.nb-t{font-size:12.5px;font-weight:500;line-height:1.35}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.mhead{background:var(--bg2);border-bottom:1px solid var(--bdr);padding:13px 24px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-shrink:0}
.sname{font-family:'Rajdhani',sans-serif;font-size:22px;font-weight:700;letter-spacing:2px;text-transform:uppercase}
.sdesc{font-size:12.5px;color:var(--t2);margin-top:3px;max-width:560px;line-height:1.4}
.sbadge{font-family:'JetBrains Mono',monospace;font-size:10px;padding:4px 10px;border:1px solid var(--bdr2);color:var(--t3);border-radius:3px;white-space:nowrap;margin-top:3px;flex-shrink:0}
.content{flex:1;overflow-y:auto;overflow-x:hidden;padding:22px}

.panel{display:none}
.panel.active{display:block;animation:fadeUp .18s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}

.card{background:var(--bg2);border:1px solid var(--bdr);border-radius:5px;padding:17px 20px}
.ctitle{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--t3);margin-bottom:13px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.mb{margin-bottom:14px}
.note{background:rgba(56,182,255,.04);border:1px solid rgba(56,182,255,.15);border-left:3px solid var(--b);padding:10px 14px;border-radius:0 4px 4px 0;font-size:12.5px;color:var(--t2);margin-top:14px;line-height:1.5}
.warn{background:rgba(255,107,53,.04);border:1px solid rgba(255,107,53,.15);border-left:3px solid var(--o);padding:10px 14px;border-radius:0 4px 4px 0;font-size:12.5px;color:var(--t2);margin-top:14px;line-height:1.5}
.hg{color:var(--g);font-weight:600}.ho{color:var(--o);font-weight:600}
.hb{color:var(--b);font-weight:600}.hr{color:var(--r);font-weight:600}.hy{color:var(--y);font-weight:600}
.tg{display:inline-block;padding:1px 7px;border-radius:3px;font-family:'JetBrains Mono',monospace;font-size:10px;background:rgba(0,229,160,.1);color:var(--g);border:1px solid rgba(0,229,160,.2)}
.tr{display:inline-block;padding:1px 7px;border-radius:3px;font-family:'JetBrains Mono',monospace;font-size:10px;background:rgba(255,71,87,.1);color:var(--r);border:1px solid rgba(255,71,87,.2)}
.tb{display:inline-block;padding:1px 7px;border-radius:3px;font-family:'JetBrains Mono',monospace;font-size:10px;background:rgba(56,182,255,.1);color:var(--b);border:1px solid rgba(56,182,255,.2)}
.ty{display:inline-block;padding:1px 7px;border-radius:3px;font-family:'JetBrains Mono',monospace;font-size:10px;background:rgba(255,211,42,.1);color:var(--y);border:1px solid rgba(255,211,42,.2)}

/* Intro */
.intro-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:14px}
.intro-p{font-size:13.5px;color:var(--t2);line-height:1.62;margin-bottom:10px}
.intro-p:last-child{margin-bottom:0}
.intro-media{display:block;background:var(--bg3);border:1px solid var(--bdr);border-radius:5px;overflow:hidden;text-decoration:none}
.intro-media:hover{border-color:var(--bdr2)}
.intro-media img{display:block;width:100%;height:auto;max-height:780px;object-fit:contain;background:#05080f}
.intro-cap{padding:9px 12px;border-top:1px solid var(--bdr);font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:1px;color:var(--t3);text-transform:uppercase}
.vbox{position:relative;padding-top:56.25%;background:#05080f;border:1px solid var(--bdr);border-radius:5px;overflow:hidden}
.vbox iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.qblk{background:var(--bg3);border:1px solid var(--bdr);border-left:3px solid var(--o);border-radius:0 4px 4px 0;padding:10px 12px;font-size:12.5px;line-height:1.55;color:var(--t2)}
.qblk strong{color:var(--o);font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase}

/* Pipeline */
.pipe-wrap{overflow-x:auto;padding-bottom:4px}
.pipe-row{display:flex;min-width:820px;gap:0;align-items:stretch}
.phase{flex:1;display:flex;flex-direction:column;gap:6px;padding:0 6px}
.ph{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;padding:4px 8px;border-radius:3px;text-align:center;margin-bottom:4px}
.ph1{background:rgba(56,182,255,.08);color:var(--b);border:1px solid rgba(56,182,255,.2)}
.ph2{background:rgba(255,211,42,.08);color:var(--y);border:1px solid rgba(255,211,42,.2)}
.ph3{background:rgba(192,132,252,.08);color:var(--p);border:1px solid rgba(192,132,252,.2)}
.ph4{background:rgba(0,229,160,.08);color:var(--g);border:1px solid rgba(0,229,160,.2)}
.ph5{background:rgba(255,107,53,.08);color:var(--o);border:1px solid rgba(255,107,53,.2)}
.sbox{background:var(--bg3);border:1px solid var(--bdr);border-radius:4px;padding:8px 10px;font-size:12px;font-weight:500;text-align:center;line-height:1.3}
.sbox small{display:block;font-size:10px;color:var(--t2);margin-top:2px;font-weight:400}
.pgap{min-width:20px;display:flex;align-items:center;justify-content:center;color:var(--t3);font-size:14px;padding-top:26px}
.phase-1 .sbox{border-color:rgba(56,182,255,.2)}
.phase-2 .sbox{border-color:rgba(255,211,42,.2)}
.phase-3 .sbox{border-color:rgba(192,132,252,.2)}
.phase-4 .sbox{border-color:rgba(0,229,160,.2)}
.phase-5 .sbox{border-color:rgba(255,107,53,.2)}

/* Funnel */
.frow{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.flbl{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--t2);min-width:190px}
.fbw{flex:1;background:var(--bg3);border:1px solid var(--bdr);border-radius:3px;height:26px;overflow:hidden}
.fbar{height:100%;display:flex;align-items:center;padding-left:10px;font-family:'JetBrains Mono',monospace;font-size:10px}
.fcnt{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:500;min-width:38px;text-align:right}
.frem{font-family:'JetBrains Mono',monospace;font-size:10px;min-width:32px;text-align:right}

/* Chain */
.chain{display:flex;flex-direction:column}
.cstep{display:flex;gap:14px;align-items:flex-start}
.cconn{display:flex;flex-direction:column;align-items:center;min-width:30px}
.cdot{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:500;flex-shrink:0;border:1.5px solid}
.cline{width:2px;flex:1;min-height:10px;background:var(--bdr);margin:2px 0}
.cbody{padding:4px 0 14px}
.ctit{font-size:13.5px;font-weight:600;margin-bottom:2px}
.cdesc{font-size:12.5px;color:var(--t2);line-height:1.4}

/* Primitives */
.prim{background:var(--bg3);border:1px solid var(--bdr);border-radius:5px;padding:16px;display:flex;flex-direction:column;gap:8px}
.pname{font-family:'Rajdhani',sans-serif;font-size:20px;font-weight:700;letter-spacing:2px;text-transform:uppercase}
.pitem{font-size:12.5px;color:var(--t2);display:flex;gap:6px;align-items:flex-start;line-height:1.4}
.pitem::before{content:'\2192';color:var(--t3);flex-shrink:0}
.pverd{margin-top:4px;font-family:'JetBrains Mono',monospace;font-size:10px;padding:6px 10px;border-radius:3px}
.vg{background:rgba(0,229,160,.07);color:var(--g);border:1px solid rgba(0,229,160,.2)}
.vr{background:rgba(255,71,87,.07);color:var(--r);border:1px solid rgba(255,71,87,.2)}
.vy{background:rgba(255,211,42,.07);color:var(--y);border:1px solid rgba(255,211,42,.2)}

/* Reasoning */
.rpanel{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:start}
.rchain{background:var(--bg3);border:1px solid var(--bdr);border-radius:5px;padding:16px}
.rtitle{font-family:'Rajdhani',sans-serif;font-size:14px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--bdr)}
.rstep{display:flex;gap:10px;align-items:flex-start;margin-bottom:7px}
.rsnum{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--t3);min-width:20px;padding-top:1px}
.rstext{font-size:13px;line-height:1.4}
.rarr{font-size:11px;color:var(--t3);padding-left:30px;margin-bottom:7px}
.rverd{margin-top:10px;padding:7px 12px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:500;letter-spacing:.5px;text-align:center}
.rvs{display:flex;align-items:center;justify-content:center;font-family:'Rajdhani',sans-serif;font-size:16px;font-weight:700;color:var(--t3);letter-spacing:2px;padding-top:50px}

/* Costs */
.crow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bdr)}
.crow:last-child{border:none}
.clbl{color:var(--t2);font-size:13px;flex:2}
.cbarw{flex:1;max-width:130px;min-width:50px;height:4px;background:var(--bg3);border-radius:2px;overflow:hidden}
.cbarf{height:100%;border-radius:2px}
.cval{font-family:'JetBrains Mono',monospace;font-size:12px;min-width:58px;text-align:right}
.cnote{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--t3);min-width:170px;text-align:right}
.bignum{font-family:'Rajdhani',sans-serif;font-size:52px;font-weight:700;line-height:1}
.biglbl{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--t2);letter-spacing:1px;text-transform:uppercase;margin-top:4px}
.codeblk{font-family:'JetBrains Mono',monospace;font-size:11.5px;padding:12px;background:var(--bg3);border-radius:4px;border:1px solid var(--bdr);line-height:1.9}
@media (max-width:860px){.intro-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<aside class="sidebar">
  <div class="sb-head">
    <div class="sb-logo">ILITHIOS</div>
    <div class="sb-tag">BYOVD Pipeline // Edge Cases Research</div>
  </div>
  <div class="sb-cat">Visualizations</div>
  <div class="nav-list" id="navList"></div>
</aside>
<main class="main">
  <div class="mhead">
    <div><div class="sname" id="secName"></div><div class="sdesc" id="secDesc"></div></div>
    <div class="sbadge" id="secBadge"></div>
  </div>
  <div class="content" id="content"></div>
</main>

<script>
var SECS=[
  {id:'intro',      name:'Introduction',              desc:'Context from Marcus Hutchins: LinkedIn post, follow-up experiment, and setup for the Ilithios BYOVD pipeline', badge:'CONTEXT'},
  {id:'pipeline',   name:'Full Pipeline Overview',      desc:'End-to-end flow: driver scraping \u2192 filtering \u2192 reverse engineering \u2192 LLM analysis \u2192 zero-day exploit', badge:'ARCHITECTURE'},
  {id:'funnel',     name:'Driver Filtering Funnel',     desc:'~100 collected drivers pass through four sequential elimination stages to yield 84 viable candidates', badge:'DATA FLOW'},
  {id:'re',         name:'Reverse Engineering Chain',   desc:'Binary .sys \u2192 IDA Pro automation \u2192 KMDF vtable resolution \u2192 pseudo-C output ready for LLM analysis', badge:'PROCESS'},
  {id:'rings',      name:'Windows Privilege Rings',     desc:'Kernel mode architecture, the signing requirement, and the BYOVD attack surface bypass path', badge:'ARCHITECTURE'},
  {id:'attack',     name:'BYOVD Attack Chain',          desc:'Step-by-step: how a legitimately signed driver becomes a full kernel read/write/execute backdoor', badge:'THREAT MODEL'},
  {id:'prims',      name:'Exploit Primitive Hierarchy', desc:'Why READ + WRITE outperforms EXECUTE alone \u2014 and why the LLM got this backwards', badge:'VULN ANALYSIS'},
  {id:'bracket',    name:'Tournament Bracket Problem',  desc:'400 drivers, 20-file API limit: the bracket structure that eliminated the best candidate in round one', badge:'LLM FAILURE'},
  {id:'reason',     name:'LLM Reasoning Failure',       desc:'Root cause: the model can explain ASLR and primitives separately but cannot synthesize them without a world model', badge:'ROOT CAUSE'},
  {id:'costs',      name:'Cost Economics',              desc:'"$2 per driver" vs. the honest math: $800+ to find one viable candidate before exploit development', badge:'ECONOMICS'},
  {id:'impact',     name:'Security Impact Curve',       desc:'Fuzzer analogy: finite vulnerability pool, dual-use spike, patching wave, and the real resource gap', badge:'THREAT INTEL'},
];

var navList=document.getElementById('navList');
var content=document.getElementById('content');
SECS.forEach(function(s,i){
  var btn=document.createElement('button');
  btn.className='nb'+(i===0?' active':'');
  btn.innerHTML='<span class="nb-n">'+String(i+1).padStart(2,'0')+'</span><span class="nb-t">'+s.name+'</span>';
  btn.addEventListener('click',function(){go(i);});
  navList.appendChild(btn);
  var p=document.createElement('div');
  p.className='panel'+(i===0?' active':'');
  p.id='p-'+s.id;
  content.appendChild(p);
});

function go(i){
  document.querySelectorAll('.nb').forEach(function(b,j){b.classList.toggle('active',j===i);});
  document.querySelectorAll('.panel').forEach(function(p,j){p.classList.toggle('active',j===i);});
  document.getElementById('secName').textContent=SECS[i].name;
  document.getElementById('secDesc').textContent=SECS[i].desc;
  document.getElementById('secBadge').textContent=SECS[i].badge;
}
go(0);

/* ===== 0. INTRO ===== */
document.getElementById('p-intro').innerHTML=`
<div class="g2 mb">
  <div class="card">
    <div class="ctitle">Question, Wiz Context, Experiment</div>
    <p class="intro-p"><span class="tb">Cablepull's question</span> was about the Wiz Mythos framing, the use of IDA to wade through large binary datasets, and how useful AI actually is in finding the truth rather than just producing convincing noise.</p>
    <p class="intro-p"><span class="ty">Marcus's response</span> was to answer with an experiment: a constrained BYOVD pipeline against Windows 11 drivers, instrumented step by step so we can see where automation helped, where it failed, and where expert judgment still carried the outcome.</p>
    <p class="intro-p"><span class="tg">Acknowledgment</span> Huge thanks to Marcus Hutchins for an incredible experiment. This kind of transparent, hands-on work helps all of us understand the current state of AI-assisted vulnerability research much better.</p>
    <div class="note"><strong style="color:var(--b)">Support:</strong> If this work is useful to you, consider subscribing to Marcus Hutchins' channel so more practitioners can follow and learn from this caliber of security research.</div>
  </div>
  <div class="card">
    <div class="ctitle">Video Source</div>
    <div class="vbox">
      <iframe src="https://www.youtube.com/embed/BLqRiL_GY3A?si=j5GcTCx_UDhxAOl0"
              title="YouTube video player"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              referrerpolicy="strict-origin-when-cross-origin"
              allowfullscreen></iframe>
    </div>
  </div>
</div>

<div class="card mb">
  <div class="ctitle">LinkedIn Transcript Capture</div>
  <a class="intro-media" href="../images/ilithios/Marcus%20Hutchins%20Question.png" target="_blank" rel="noopener">
    <img src="../images/ilithios/Marcus%20Hutchins%20Question.png"
         alt="Screenshot capture of Marcus Hutchins LinkedIn transcript prompt discussing an AI zero-day pipeline experiment."
         loading="lazy"
         decoding="async">
    <div class="intro-cap">Open full-size image in new tab</div>
  </a>
</div>

<div class="intro-grid">
  <div class="card">
    <div class="ctitle">How The Experiment Maps To Wiz</div>
    <p class="intro-p">Wiz's Mythos write-up argues that the immediate reality is not magical one-shot exploitation by amateurs, but a world where capable teams can use stronger AI-assisted workflows to find more vulnerabilities, reverse binaries faster, and compress the time between discovery and weaponization.</p>
    <p class="intro-p">Marcus's pipeline is evidence for that middle position. The target class was narrow and deliberate: third-party signed Windows 11 kernel drivers vulnerable to BYOVD abuse. The workflow used deterministic stages for collection, filtering, VM validation, IDA automation, KMDF resolution, and pseudo-C generation before handing anything to the model.</p>
    <p class="intro-p">The result supports a more grounded reading of Mythos: the model helped, but the workflow only became useful because expert knowledge supplied the task decomposition, ranking logic, and exploit criteria the model lacked on its own.</p>
  </div>
  <div class="card">
    <div class="ctitle">Why This Matters</div>
    <div class="qblk">
      <strong>Practical takeaway</strong><br><br>
      "The LLM is not teaching me exploitation. I'm teaching it exploitation."<br><br>
      That is the bridge between your question and the Wiz description: capability is real, but it arrives first through expert-built systems and AI-augmented pipelines, not by instantly handing script kiddies a universal zero-day machine.
    </div>
    <div class="warn"><strong style="color:var(--o)">Operational caveat:</strong> the experiment also reinforces the harder part of the Wiz framing: patch pressure rises, expert workflows gain leverage, and underfunded open-source or small teams remain the least able to absorb the new cost and tempo.</div>
  </div>
</div>`;

/* ===== 1. PIPELINE ===== */
document.getElementById('p-pipeline').innerHTML=`
<div class="card mb">
  <div class="ctitle">End-to-End Ilithios Pipeline \u2014 5 Phases</div>
  <div class="pipe-wrap"><div class="pipe-row">
    <div class="phase phase-1">
      <div class="ph ph1">01 \u00b7 Collection</div>
      <div class="sbox">Web Scraper<small>Python script</small></div>

      <div class="sbox">Tournament<small>Best candidate</small></div>
    </div>
    <div class="pgap">\u25ba</div>
    <div class="phase phase-5">
      <div class="ph ph5">05 \u00b7 Exploit Dev</div>
      <div class="sbox">Expert Triage<small>Human review</small></div>
      <div class="sbox">Exploit Prompt<small>Iterative R&amp;D</small></div>
      <div class="sbox" style="border-color:rgba(255,107,53,.5);color:var(--o)">Zero-Day<small style="color:var(--o)">Kernel priv-esc</small></div>
    </div>

</div>
<div class="g2">
  <div class="card">
    <div class="ctitle">LLM Usage Policy</div>
    <p style="font-size:13px;color:var(--t2);line-height:1.6">Phases 1\u20133 use <span class="hg">zero LLM calls</span> \u2014 pure Python scripting and IDA automation. LLMs are invoked only where pattern-matching on decompiled C code is genuinely needed. The guiding principle: "If a task does not need to be done by an LLM, it shouldn't be."</p>
  </div>
