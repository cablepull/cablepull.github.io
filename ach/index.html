<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACH Explorer</title>
  <meta name="description" content="Analysis of Competing Hypotheses workbench — hostable, JSON-driven, internationalized">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header class="header">
      <div class="brand">
        <span class="brand-mark">ACH</span><span class="brand-sep">//</span><span class="brand-name">EXPLORER</span>
      </div>
      <div class="header-controls">
        <label class="control">
          <span class="control-label" data-i18n="ui.selectAnalysis">Analysis</span>
          <select id="analysis-picker" class="select"></select>
        </label>
        <label class="control">
          <span class="control-label" data-i18n="ui.language">Lang</span>
          <select id="language-picker" class="select"></select>
        </label>
      </div>
    </header>

    <nav class="tabs" id="tabs">
      <button class="tab is-active" data-view="overview"   data-i18n="ui.tabOverview">Overview</button>
      <button class="tab"           data-view="matrix"     data-i18n="ui.tabMatrix">Matrix</button>
      <button class="tab"           data-view="network"    data-i18n="ui.tabNetwork">Network</button>
      <button class="tab"           data-view="evidence"   data-i18n="ui.tabEvidence">Evidence</button>
      <button class="tab"           data-view="hypotheses" data-i18n="ui.tabHypotheses">Hypotheses</button>
      <button class="tab"           data-view="whatif"     data-i18n="ui.tabWhatIf">What-If</button>
    </nav>

    <main class="main">
      <section class="view view-overview is-active" data-view="overview"></section>
      <section class="view view-matrix"             data-view="matrix"></section>
      <section class="view view-network"            data-view="network"></section>
      <section class="view view-evidence"           data-view="evidence"></section>
      <section class="view view-hypotheses"         data-view="hypotheses"></section>
      <section class="view view-whatif"             data-view="whatif"></section>
    </main>

    <aside class="drilldown" id="drilldown" aria-hidden="true">
      <div class="drilldown-inner" id="drilldown-content"></div>
    </aside>

    <div class="status-bar" id="status-bar"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
